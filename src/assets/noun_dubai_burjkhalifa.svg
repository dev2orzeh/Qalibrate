<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="currentColor">
  <!-- Architectural Silhouette: Burj Khalifa & Dubai Financial District Skyline -->
  <g>
    <!-- Central Spire & Needle -->
    <rect x="74" y="10" width="2" height="18"/>
    <polygon points="73.5,28 76.5,28 76,40 74,40"/>
    
    <!-- Tier 1: Highest Setbacks -->
    <rect x="72.5" y="40" width="5" height="15"/>
    <polygon points="71,55 79,55 78,68 72,68"/>
    
    <!-- Tier 2: Mid-High Setbacks -->
    <rect x="70" y="68" width="10" height="16"/>
    <polygon points="67.5,84 82.5,84 81.5,98 68.5,98"/>
    
    <!-- Tier 3: Mid Setbacks -->
    <rect x="66" y="98" width="18" height="16"/>
    <polygon points="63,114 87,114 85.5,128 64.5,128"/>
    
    <!-- Tier 4: Base Buttresses & Wings -->
    <polygon points="56,128 94,128 92,136 58,136"/>
    
    <!-- Left Stepped Fin Detail -->
    <polygon points="60,110 65,110 65,128 58,128"/>
    <polygon points="64,92 68,92 68,110 62,110"/>
    
    <!-- Right Stepped Fin Detail -->
    <polygon points="85,110 90,110 92,128 85,128"/>
    <polygon points="82,92 86,92 88,110 82,110"/>

    <!-- Flanking Emirates Towers Silhouette -->
    <!-- Left Tower -->
    <polygon points="40,94 48,82 48,136 40,136"/>
    <rect x="42" y="78" width="1.5" height="4"/>
    <!-- Right Tower -->
    <polygon points="102,98 110,88 110,136 102,136"/>
    <rect x="108" y="84" width="1.5" height="4"/>

    <!-- Podium Foundation Base Plinth -->
    <rect x="24" y="136" width="102" height="4" rx="1"/>
  </g>
</svg>
